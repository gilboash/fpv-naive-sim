; An ESP32-S3 as a USB joystick for driving a simulator from fpvsim's pilot.
; Flash: cd firmware/stick-esp32s3 && pio run -t upload
;
; USB_MODE=0 puts the native port in TinyUSB (OTG) mode, which is what lets it
; be a HID device; CDC_ON_BOOT keeps a serial port on the same cable for the
; stick commands. Once flashed, the board is no longer the ROM's JTAG/serial
; unit, so a re-flash may need the BOOT button held while plugging in.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; The core's USB library includes FS.h from its mass-storage files without
  ; declaring the dependency, so the include path has to be given.
  -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
monitor_speed = 115200
lib_deps = FS
lib_ldf_mode = chain+
